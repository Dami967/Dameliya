name: Production Deployment
on:
  push:
    branches: [ main ] # Change to 'master' if they use master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Pull Vercel Environment Information
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Check Supabase production configuration
        run: |
          set -euo pipefail
          env_file=.vercel/.env.production.local
          if [ ! -s "$env_file" ]; then
            echo "::error::Vercel production environment was not downloaded"
            exit 1
          fi
          if ! grep -Eq '^VITE_SUPABASE_URL="?https?://' "$env_file"; then
            echo "::error::VITE_SUPABASE_URL is missing or invalid in Vercel Production"
            exit 1
          fi
          if ! grep -Eq '^VITE_SUPABASE_ANON_KEY="?.+' "$env_file"; then
            echo "::error::VITE_SUPABASE_ANON_KEY is missing in Vercel Production"
            exit 1
          fi

      - name: Build Project Artifacts
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy Project Artifacts to Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
